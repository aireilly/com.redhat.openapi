name: Publish tagged plugin ZIP

on:
  push:
    tags:
      - '*.*.*'
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v7

      - name: Package DITA-OT plugin
        run: zip -r "$RUNNER_TEMP/openapi2dita.zip" plugin.xml build_openapi2dita.xml lib xsl

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenAPI2DITA ${{ github.ref_name }}
          body: Installable DITA-OT plugin ZIP for version ${{ github.ref_name }}.
          files: ${{ runner.temp }}/openapi2dita.zip
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
